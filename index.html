  const KEY = "gsp_event_20260914";
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(D.salt), iterations:D.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(D.iv)}, key, u8(D.ct));
    document.querySelector(".deck-stage").innerHTML = new TextDecoder().decode(buf);
    document.getElementById("gate").remove();
    const s = document.createElement("script"); s.src = "js07/deck07.js"; document.body.appendChild(s);
    sessionStorage.setItem(KEY, pw);
    // スマホ用：左右スワイプ／画面の右半分タップで次、左半分で前
    let x0 = null;
    const go = d => window.templateDeck && window.templateDeck.show(window.templateDeck.current() + d);
    document.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
    document.addEventListener("touchend", e => {
      if (x0 === null || e.target.closest(".deck-nav")) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
      else go(e.changedTouches[0].clientX > innerWidth / 2 ? 1 : -1);
    });

  const form = document.getElementById("gate-form");
